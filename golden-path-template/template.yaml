apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: appian-handoff-construccion
  title: Appian Handoff Construccion
  description: Crea un microservicio Node.js con CI/CD y registro en catálogo Backstage
  tags:
    - golden-path
    - nodejs
    - microservice
spec:
  owner: group:default/arquitectura
  type: service

  parameters:
    - title: Información del servicio
      required:
        - name
        - description
      properties:
        name:
          title: Nombre del servicio
          type: string
          description: Nombre en kebab-case (ej. my-service)
          pattern: '^[a-z][a-z0-9-]*$'
        description:
          title: Descripción
          type: string
        lifecycle:
          title: Ciclo de vida
          type: string
          enum: [experimental, production, deprecated]
          default: experimental

  steps:
    - id: fetch-template
      name: Generar estructura del proyecto
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: write-catalog
      name: Crear catalog-info.yaml
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.name }}
            description: ${{ parameters.description }}
            annotations:
              github.com/project-slug: edzero01/${{ parameters.name }}
              profuturo.mx/layer: experience
          spec:
            type: service
            lifecycle: ${{ parameters.lifecycle }}
            owner: group:default/arquitectura

    - id: publish
      name: Publicar en GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.name }}&owner=edzero01
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main

    - id: register
      name: Registrar en catálogo Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositorio GitHub
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ver en catálogo
        icon: catalog
        entityRef: component:default/${{ parameters.name }}
